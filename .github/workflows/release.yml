# Publishes the images when a version is tagged (v1.2.3), or by hand: the server (one container with
# the web app, Postgres and the CPU worker) for 64-bit x86 and ARM, and the GPU worker for x86 (ONNX
# Runtime's GPU build has no ARM wheels), to GitHub's container registry. The ARM build runs under
# QEMU, as the server links libvips and is built on the platform it's for.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - image: photostead
            dockerfile: deploy/docker/Dockerfile
            platforms: linux/amd64,linux/arm64
          - image: photostead-worker
            dockerfile: deploy/docker/worker.Dockerfile
            platforms: linux/amd64
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
