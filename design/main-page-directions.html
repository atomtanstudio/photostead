<title>Photostead Main Page</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap">
<style>
/* Layout: a neutral review desk with a switcher on top; below it, one app window showing the chosen direction of the Library screen. */
:root{
  /* review desk */
  --rb-bg:#ECEBE7; --rb-panel:#FFFFFF; --rb-fg:#1B1B1A; --rb-muted:#64625D; --rb-line:#D8D5CF; --rb-accent:#1B1B1A; --rb-on:#FFFFFF; --focus:#3E63DD;
  /* A · Darkroom */
  --a-bg:#F3F2EF; --a-chrome:rgba(243,242,239,.86); --a-fg:#161513; --a-muted:#65625C; --a-line:#DDD9D3; --a-accent:#9A5800; --a-tile:#E1DED8;
  /* B · Photo Book */
  --b-bg:#FFFFFF; --b-fg:#141414; --b-muted:#66655F; --b-line:#E6E3DE; --b-accent:#C2352B; --b-tile:#EEEDEA;
  /* C · Ambient (accent is replaced at runtime with a color taken from the photos) */
  --c-bg:#F6F6F7; --c-fg:#121316; --c-muted:#5A5E67; --c-glass:rgba(255,255,255,.7); --c-glass-line:rgba(18,19,22,.09); --c-acc:var(--c-acc-l,#2D6FD6); --c-on-acc:#FFFFFF; --c-tile:#E6E7EA;
  /* D · Studio */
  --d-bg:#EDEEF0; --d-panel:#F8F8F9; --d-fg:#16181C; --d-muted:#585F68; --d-line:#D3D6DB; --d-accent:#2563EB; --d-on:#FFFFFF; --d-tile:#DCDFE4; --d-hover:#E3E5E9;
  /* semantic, shared */
  --ok:#1F9D55; --lab-red:#E5484D; --lab-yellow:#E9A23B; --lab-green:#30A46C; --lab-blue:#3E63DD; --lab-purple:#8E4EC6;
  /* type */
  --font-ui:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-a:"Geist","Helvetica Neue",Arial,sans-serif; --mono-a:"Geist Mono",ui-monospace,Menlo,monospace;
  --serif-b:"Instrument Serif","Iowan Old Style",Georgia,serif; --sans-b:"Instrument Sans","Helvetica Neue",Arial,sans-serif;
  --font-c:"Figtree","Avenir Next",system-ui,sans-serif;
  --font-d:"IBM Plex Sans",system-ui,sans-serif; --mono-d:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  height:100%; box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --rb-bg:#0E0E0F; --rb-panel:#18181A; --rb-fg:#EDECE9; --rb-muted:#9A9893; --rb-line:#2A2A2C; --rb-accent:#EDECE9; --rb-on:#111111; --focus:#8EA8FF;
    --a-bg:#0B0B0C; --a-chrome:rgba(11,11,12,.8); --a-fg:#EEEBE6; --a-muted:#8F8B85; --a-line:#262628; --a-accent:#F2A93B; --a-tile:#18181A;
    --b-bg:#141312; --b-fg:#F0EEE9; --b-muted:#9C9890; --b-line:#2B2926; --b-accent:#FF7A6B; --b-tile:#22211F;
    --c-bg:#0D0E11; --c-fg:#F2F3F5; --c-muted:#9EA3AD; --c-glass:rgba(30,32,38,.6); --c-glass-line:rgba(255,255,255,.1); --c-acc:var(--c-acc-d,#7AA7FF); --c-on-acc:#0D0E11; --c-tile:#1A1C21;
    --d-bg:#111214; --d-panel:#17181B; --d-fg:#E5E6E9; --d-muted:#8C919A; --d-line:#26282C; --d-accent:#2E6AE6; --d-on:#FFFFFF; --d-tile:#1E2024; --d-hover:#202226;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --rb-bg:#0E0E0F; --rb-panel:#18181A; --rb-fg:#EDECE9; --rb-muted:#9A9893; --rb-line:#2A2A2C; --rb-accent:#EDECE9; --rb-on:#111111; --focus:#8EA8FF;
  --a-bg:#0B0B0C; --a-chrome:rgba(11,11,12,.8); --a-fg:#EEEBE6; --a-muted:#8F8B85; --a-line:#262628; --a-accent:#F2A93B; --a-tile:#18181A;
  --b-bg:#141312; --b-fg:#F0EEE9; --b-muted:#9C9890; --b-line:#2B2926; --b-accent:#FF7A6B; --b-tile:#22211F;
  --c-bg:#0D0E11; --c-fg:#F2F3F5; --c-muted:#9EA3AD; --c-glass:rgba(30,32,38,.6); --c-glass-line:rgba(255,255,255,.1); --c-acc:var(--c-acc-d,#7AA7FF); --c-on-acc:#0D0E11; --c-tile:#1A1C21;
  --d-bg:#111214; --d-panel:#17181B; --d-fg:#E5E6E9; --d-muted:#8C919A; --d-line:#26282C; --d-accent:#2E6AE6; --d-on:#FFFFFF; --d-tile:#1E2024; --d-hover:#202226;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
body{height:100%;margin:0;background:var(--rb-bg);color:var(--rb-fg);font-family:var(--font-ui);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.page{height:100%;display:flex;flex-direction:column;gap:10px;padding-block:12px 14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- review desk ---------- */
.review{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.rv-brand{display:flex;align-items:center;gap:8px;margin-right:auto;min-width:0}
.rv-brand svg{width:20px;height:20px;flex:0 0 auto}
.rv-brand strong{font-size:15px;font-weight:650;letter-spacing:-.01em}
.rv-brand span{font-size:13px;color:var(--rb-muted)}
.rv-seg{display:inline-flex;gap:2px;padding:3px;border-radius:10px;background:var(--rb-panel);border:1px solid var(--rb-line);max-width:100%;overflow-x:auto;scrollbar-width:none}
.rv-seg::-webkit-scrollbar{display:none}
.rv-seg button{height:30px;padding:0 12px;border:0;border-radius:7px;background:transparent;color:var(--rb-muted);font-size:13px;font-weight:550;white-space:nowrap;cursor:pointer}
.rv-seg button:hover{color:var(--rb-fg)}
.rv-seg button[aria-pressed="true"]{background:var(--rb-accent);color:var(--rb-on)}
.rv-seg button b{font-family:ui-monospace,Menlo,monospace;font-weight:600;margin-right:6px;opacity:.6}
.rv-opts{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.rv-switch{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 12px;border-radius:10px;border:1px solid var(--rb-line);background:var(--rb-panel);font-size:13px;cursor:pointer}
.rv-switch input{accent-color:var(--rb-accent);width:15px;height:15px;margin:0}
.rv-note{flex-basis:100%;margin:0;font-size:12.5px;line-height:1.45;color:var(--rb-muted)}
.rv-note b{color:var(--rb-fg);font-weight:600}

/* ---------- app window ---------- */
.window{position:relative;flex:1;min-height:440px;border-radius:14px;overflow:hidden;border:1px solid var(--rb-line);background:var(--rb-panel);box-shadow:0 1px 2px rgba(0,0,0,.05),0 18px 50px -24px rgba(0,0,0,.35)}
.app{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden}
.scroller{position:relative;flex:1;min-height:0;min-width:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.tl{position:relative}

/* ---------- tiles (shared) ---------- */
.rows{display:flex;flex-direction:column}
.row{display:flex}
.tile{position:relative;flex:0 0 auto;overflow:hidden;background:var(--tile-ph)}
.tile-open{position:absolute;inset:0;display:block;width:100%;height:100%;padding:0;border:0;background:none;cursor:zoom-in}
.ph{position:absolute;inset:0;width:100%;height:100%;display:block;opacity:0;transition:opacity .45s ease,transform .18s ease,border-radius .18s ease}
.ph.on{opacity:1}
.tile .shade{position:absolute;inset:0 0 auto 0;height:60px;background:linear-gradient(rgba(0,0,0,.38),rgba(0,0,0,0));opacity:0;transition:opacity .15s;pointer-events:none}
.tile:hover .shade,.selecting .tile .shade{opacity:1}
.tile-check{position:absolute;top:8px;left:8px;width:24px;height:24px;padding:0;border-radius:50%;border:1.6px solid rgba(255,255,255,.92);background:rgba(0,0,0,.14);color:transparent;display:grid;place-items:center;opacity:0;transition:opacity .15s;cursor:pointer}
.tile-check svg{width:14px;height:14px}
.tile:hover .tile-check,.tile:focus-within .tile-check,.selecting .tile-check{opacity:1}
.tile.sel .tile-check{opacity:1;background:var(--sel);border-color:var(--sel);color:var(--sel-on)}
.tile.sel{background:color-mix(in srgb,var(--sel) 18%,var(--tile-ph))}
.badges{position:absolute;top:8px;right:8px;display:flex;gap:5px;pointer-events:none}
.badge{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 6px;border-radius:5px;background:rgba(0,0,0,.46);color:#fff;font-size:10.5px;font-weight:650;letter-spacing:.03em;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.badge svg{width:12px;height:12px}
.fav-ic{position:absolute;left:8px;bottom:7px;color:#fff;pointer-events:none;filter:drop-shadow(0 1px 2px rgba(0,0,0,.55))}
.fav-ic svg{width:16px;height:16px;display:block}
.selday{width:22px;height:22px;padding:0;border-radius:50%;border:1.5px solid currentColor;background:transparent;color:inherit;display:inline-grid;place-items:center;opacity:0;transition:opacity .15s;cursor:pointer;flex:0 0 auto}
.selday svg{width:12px;height:12px}
.dayh:hover .selday,.selday:focus-visible,.selecting .selday{opacity:.75}
.dtag{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;border:1px solid currentColor;font-size:11px;font-weight:600;letter-spacing:.02em;text-transform:none;white-space:nowrap}
.dtag svg{width:12px;height:12px}

/* highlights (shared) */
.hl-card{position:relative;flex:0 0 auto;overflow:hidden;padding:0;border:0;cursor:pointer;text-align:left;background:var(--tile-ph)}
.ph-box{position:absolute;inset:0;display:block}
.hl-card .scrim{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.62),rgba(0,0,0,0) 58%)}
.hl-card .t{position:absolute;left:14px;right:14px;bottom:12px;display:flex;flex-direction:column;gap:2px;color:#fff}
.hl-card .t b{font-size:16px;font-weight:650}
.hl-card .t small{font-size:12px;opacity:.88}

/* selection bar (shared) */
.selbar{position:absolute;left:50%;top:12px;z-index:8;transform:translateX(-50%);display:flex;align-items:center;gap:2px;padding:5px;border-radius:12px;background:var(--sb-bg);color:var(--sb-fg);box-shadow:0 14px 34px -14px rgba(0,0,0,.5);max-width:calc(100% - 24px);overflow-x:auto;white-space:nowrap;scrollbar-width:none}
.selbar button{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 10px;border:0;border-radius:8px;background:transparent;color:inherit;font-size:13px;font-weight:600;cursor:pointer}
.selbar button:hover{background:color-mix(in srgb,currentColor 14%,transparent)}
.selbar svg{width:16px;height:16px}
.selbar .sb-n{padding:0 10px 0 4px;font-size:13px;font-weight:700}

/* scrubber (shared) */
.scrub{position:absolute;right:6px;top:80px;bottom:20px;width:46px;z-index:4;font-variant-numeric:tabular-nums}
.scrub-y{position:absolute;right:4px;padding:0 2px;border:0;background:none;color:var(--scrub-fg);font:inherit;font-size:10.5px;line-height:1;opacity:.55;cursor:pointer}
.scrub-y:hover{opacity:1;color:var(--scrub-acc)}
.scrub-dot{position:absolute;right:14px;width:3px;height:3px;border-radius:50%;background:var(--scrub-fg);opacity:.3}
.scrub-handle{position:absolute;right:0;top:0;width:26px;height:2px;border-radius:2px;background:var(--scrub-acc)}
.scrub-label{position:absolute;right:34px;top:50%;transform:translateY(-50%);padding:5px 9px;border-radius:7px;background:var(--scrub-acc);color:var(--scrub-on);font-size:11.5px;font-weight:650;white-space:nowrap;opacity:0;transition:opacity .3s;pointer-events:none}
.scrub.active .scrub-label{opacity:1}

/* ================= A · Darkroom ================= */
.dir-a{background:var(--a-bg);color:var(--a-fg);font-family:var(--font-a);--tile-ph:var(--a-tile);--sel:var(--a-accent);--sel-on:var(--a-bg);--scrub-fg:var(--a-fg);--scrub-acc:var(--a-accent);--scrub-on:var(--a-bg);--sb-bg:var(--a-fg);--sb-fg:var(--a-bg)}
.a-top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:22px;height:62px;padding:0 18px 0 24px;background:var(--a-chrome);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);border-bottom:1px solid var(--a-line)}
.a-brand{display:flex;align-items:center;gap:9px;font-size:17px;font-weight:600;letter-spacing:-.015em}
.a-brand svg{width:22px;height:22px;color:var(--a-accent)}
.a-nav{display:flex;gap:2px}
.a-nav a{position:relative;padding:8px 12px;border-radius:8px;color:var(--a-muted);font-size:14px;font-weight:500;text-decoration:none}
.a-nav a:hover,.a-nav a[aria-current]{color:var(--a-fg)}
.a-nav a[aria-current]::after{content:"";position:absolute;left:50%;bottom:1px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--a-accent)}
.a-tools{display:flex;align-items:center;gap:6px;margin-left:auto}
.a-search{display:flex;align-items:center;gap:10px;width:min(360px,34vw);height:38px;padding:0 8px 0 12px;border:1px solid var(--a-line);border-radius:10px;background:transparent;color:var(--a-muted);font-size:13px;cursor:text;text-align:left}
.a-search svg{width:17px;height:17px;flex:0 0 auto}
.a-search span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.a-search kbd{font-family:var(--mono-a);font-size:11px;padding:2px 6px;border:1px solid var(--a-line);border-radius:5px}
.a-icon{display:grid;place-items:center;width:38px;height:38px;border:0;border-radius:10px;background:transparent;color:var(--a-fg);cursor:pointer}
.a-icon:hover{background:color-mix(in srgb,var(--a-fg) 8%,transparent)}
.a-hl{padding:22px 24px 0}
.a-hl-head{display:flex;align-items:baseline;gap:12px;margin-bottom:12px}
.a-hl-head h2{margin:0;font-size:14px;font-weight:600}
.a-hl-head span{font-size:12px;color:var(--a-muted)}
.a-hl-row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.a-hl-row::-webkit-scrollbar{display:none}
.dir-a .hl-card{width:292px;height:164px;border-radius:4px}
.dir-a .tl{padding:4px 64px 120px 24px}
.a-month{display:flex;align-items:baseline;gap:12px;margin:40px 0 0}
.a-month h2{margin:0;font-size:44px;line-height:1;font-weight:600;letter-spacing:-.035em}
.a-month span{font-size:44px;line-height:1;font-weight:300;letter-spacing:-.035em;color:var(--a-muted)}
.a-month em{margin-left:auto;font-style:normal;font-family:var(--mono-a);font-size:12px;color:var(--a-muted)}
.a-day{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;margin:22px 0 10px;min-height:24px;font-size:13px;color:var(--a-muted)}
.a-day b{font-size:11.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--a-fg)}
.a-day em{margin-left:auto;font-style:normal;font-family:var(--mono-a);font-size:11.5px}
.a-day .dtag{color:var(--a-accent)}
.dir-a .tile{border-radius:2px}
.dir-a .tile.sel .ph{transform:scale(.9);border-radius:6px}

/* ================= B · Photo Book ================= */
.dir-b{flex-direction:row;background:var(--b-bg);color:var(--b-fg);font-family:var(--sans-b);--tile-ph:var(--b-tile);--sel:var(--b-accent);--sel-on:var(--b-bg);--scrub-fg:var(--b-fg);--scrub-acc:var(--b-accent);--scrub-on:var(--b-bg);--sb-bg:var(--b-fg);--sb-fg:var(--b-bg)}
.b-rail{flex:0 0 232px;display:flex;flex-direction:column;gap:28px;padding:30px 24px 24px 30px;border-right:1px solid var(--b-line);overflow-y:auto}
.b-brand{display:flex;align-items:center;gap:10px;font-family:var(--serif-b);font-size:31px;line-height:1;letter-spacing:-.01em}
.b-brand svg{width:22px;height:22px;flex:0 0 auto}
.b-search{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--b-fg);color:var(--b-muted)}
.b-search:focus-within{border-bottom-color:var(--b-accent)}
.b-search svg{width:16px;height:16px;flex:0 0 auto}
.b-search input{flex:1;min-width:0;border:0;background:transparent;color:var(--b-fg);font:inherit;font-size:14px;outline:none}
.b-search input::placeholder{color:var(--b-muted)}
.b-nav{display:flex;flex-direction:column}
.b-nav a{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--b-line);color:var(--b-fg);text-decoration:none;font-size:15px}
.b-nav a em{font-style:normal;font-size:12px;color:var(--b-muted);font-variant-numeric:tabular-nums}
.b-nav a[aria-current] span{font-family:var(--serif-b);font-style:italic;font-size:22px;line-height:1;text-decoration:underline;text-decoration-color:var(--b-accent);text-decoration-thickness:2px;text-underline-offset:6px}
.b-nav a:hover span{color:var(--b-accent)}
.b-foot{margin:auto 0 0;font-size:12px;line-height:1.6;color:var(--b-muted)}
.b-foot b{color:var(--b-fg);font-weight:600}
.dir-b .scroller{flex:1}
.b-main{padding:34px 72px 140px 48px}
.b-hl{margin-bottom:8px}
.b-hl-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-bottom:10px;margin-bottom:18px;border-bottom:1px solid var(--b-line)}
.b-hl-head h2{margin:0;font-family:var(--serif-b);font-weight:400;font-size:30px}
.b-hl-head span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--b-muted)}
.b-hl-row{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(160px,1fr);gap:22px;overflow-x:auto;scrollbar-width:none}
.b-chap{display:flex;flex-direction:column;gap:8px;padding:0;border:0;background:none;text-align:left;cursor:pointer;color:var(--b-fg)}
.b-chap-img{position:relative;display:block;width:100%;aspect-ratio:4/5;overflow:hidden;background:var(--b-tile)}
.b-chap-t{font-family:var(--serif-b);font-size:21px;line-height:1.1}
.b-chap-d{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--b-muted)}
.b-month{display:flex;align-items:flex-end;flex-wrap:wrap;gap:6px 18px;margin:60px 0 6px;padding-bottom:14px;border-bottom:1px solid var(--b-fg)}
.b-month h2{margin:0;font-family:var(--serif-b);font-weight:400;font-size:clamp(56px,8vw,108px);line-height:.85;letter-spacing:-.025em}
.b-month .yr{padding-bottom:8px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--b-muted)}
.b-month .ct{margin-left:auto;padding-bottom:8px;font-size:13px;color:var(--b-muted)}
.b-day{display:flex;align-items:baseline;flex-wrap:wrap;gap:6px 14px;margin:34px 0 14px}
.b-day h3{margin:0;font-family:var(--serif-b);font-style:italic;font-weight:400;font-size:27px;line-height:1.1}
.b-day .place{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--b-muted)}
.b-day .dtag{color:var(--b-accent);align-self:center}
.b-day .selday{align-self:center}
.dir-b .badge{background:rgba(255,255,255,.92);color:#141414;backdrop-filter:none;-webkit-backdrop-filter:none;border-radius:2px;letter-spacing:.08em}
.grease{position:absolute;left:5px;top:5px;width:calc(100% - 10px);height:calc(100% - 10px);pointer-events:none;opacity:0;overflow:visible}
.grease path{fill:none;stroke:var(--b-accent);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.dir-b .tile.sel .grease{opacity:1}
.dir-b .scrub-y{font-family:var(--serif-b);font-style:italic;font-size:13px}

/* ================= C · Ambient ================= */
.dir-c{background:color-mix(in oklab,var(--c-bg) 93%,var(--c-acc));color:var(--c-fg);font-family:var(--font-c);transition:background-color .7s ease;--tile-ph:color-mix(in oklab,var(--c-tile) 85%,var(--c-acc));--sel:var(--c-acc);--sel-on:var(--c-on-acc);--scrub-fg:var(--c-fg);--scrub-acc:var(--c-acc);--scrub-on:var(--c-on-acc);--sb-bg:var(--c-acc);--sb-fg:var(--c-on-acc)}

function sFlower(ctx,w,h,r){

function grain(ctx,w,h){

}

function photoCanvas(item,w,h){
  w=Math.max(4,Math.round(w));h=Math.max(4,Math.round(h));
  const key=item.id+':'+w+'x'+h;
  let c=CACHE.get(key);if(c)return c;
  c=document.createElement('canvas');c.className='ph';c.setAttribute('aria-hidden','true');
  c.width=Math.round(w*DPR);c.height=Math.round(h*DPR);
  const ctx=c.getContext('2d');ctx.setTransform(DPR,0,0,DPR,0,0);ctx._dpr=DPR;
  try{(SCENES[item.s]||sMountains)(ctx,w,h,rng(item.seed));}catch(e){ctx.fillStyle='#777777';ctx.fillRect(0,0,w,h);}
  ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
  vignette(ctx,w,h);grain(ctx,w,h);
  CACHE.set(key,c);
  if(CACHE.size>280){for(const [k,cv] of CACHE){if(!cv.isConnected){CACHE.delete(k);if(CACHE.size<=220)break;}}}
  return c;
}

function justify(items,W,target,gap){
  const rows=[];let row=[],sum=0;
  const fit=(rw,h,full)=>{const ws=rw.map(it=>it.a*h);if(full){const tot=ws.reduce((a,b)=>a+b,0)+gap*(rw.length-1);ws[ws.length-1]+=W-tot;}return{h:h,cells:rw.map((it,i)=>({it:it,w:ws[i]}))};};
  for(const it of items){row.push(it);sum+=it.a;const h=(W-gap*(row.length-1))/sum;if(h<=target){rows.push(fit(row,h,true));row=[];sum=0;}}
  if(row.length){rows.push(fit(row,Math.min(target,(W-gap*(row.length-1))/sum),false));}
  return rows;
}
function rowsHTML(items,W){
  const cfg=DIRS[state.dir],gap=cfg.gap,phone=W<560,mode=state.grid[state.dir];
  let rows;
  if(mode==='square'){
    const target=state.dir==='d'&&!phone?state.dens:(phone?cfg.sqPhone:cfg.sq);
    const cols=Math.max(2,Math.round((W+gap)/(target+gap)));const size=(W-gap*(cols-1))/cols;
    rows=[];for(let i=0;i<items.length;i+=cols)rows.push({h:size,cells:items.slice(i,i+cols).map(it=>({it:it,w:size}))});
  }else{
    const target=state.dir==='d'&&!phone?state.dens:(phone?cfg.rowPhone:cfg.row);
    rows=justify(items,W,target,gap);
  }
  return '<div class="rows" style="gap:'+gap+'px">'+rows.map(r=>'<div class="row" style="gap:'+gap+'px;height:'+r.h.toFixed(2)+'px">'+r.cells.map(c=>tileHTML(c.it,c.w,r.h)).join('')+'</div>').join('')+'</div>';
}

 '<nav class="c-dock" aria-label="Main"><a href="#" aria-current="page">'+I.photos+'<span>Library</span></a><a href="#">'+I.coll+'<span>Collections</span></a><a href="#">'+I.search+'<span>Search</span></a><a href="#">'+I.share+'<span>Sharing</span></a>'+
  '<button type="button" class="c-fab" data-nav="Upload" aria-label="Upload">'+I.plus+'</button></nav></div>';}

function dSec(t,rows){return '<div class="d-sec"><h3>'+t+'</h3>'+rows.map(r=>'<a href="#" class="'+(r[3]||'')+'"'+(r[3]==='on'?' aria-current="page"':'')+'>'+I[r[0]]+'<span>'+r[1]+'</span>'+(r[2]?'<em>'+r[2]+'</em>':'')+'</a>').join('')+'</div>';}
function appD(){const g=state.grid.d;return '<div class="app dir-d">'+
 '<aside class="d-side" aria-label="Library sections"><div class="d-brand">'+I.mark+'<span>PHOTOSTEAD</span></div>'+
  dSec('Library',[['photos','All photos','48,213','on'],['heart','Favorites','1,204'],['clock','Recently added','86']])+
  dSec('Workspaces',[['cull','Cull',''],['sliders','Edit','']])+
  dSec('Collections',[['person','People','312'],['spark','Characters','47'],['pin','Places','1,140'],['album','Albums','86'],['chevd','Trips','','in1'],['chevd','2026','','in2'],['album','Kyoto','186','in3'],['album','Yosemite','148','in3'],['album','Family','2,410','in1'],['album','Portfolio','212','in1']])+
  dSec('Folders',[['folder','photos/2026','6,140'],['folder','old-app/library','read-only']])+
  dSec('Utilities',[['shot','Screenshots','3,412'],['doc','Documents','918'],['spark','AI-generated','6,203'],['link','Captured from web','1,457']])+
  dSec('Spaces',[['home','Household','21,880'],['trash','Trash','32']])+
 '</aside><div class="d-main" data-scrub-host>'+
  '<div class="d-toolbar"><div class="d-title"><h1>All photos</h1><span>48,213 · 2,104 videos</span></div>'+
   '<label class="d-search">'+I.search+'<span class="sr">Search or filter</span><input id="d-q" type="search" placeholder="Search or filter, e.g. rating:4+ camera:x-t5 prompt:&quot;neon&quot;" autocomplete="off"></label>'+
   '<div class="d-seg" role="group" aria-label="Grid layout"><button type="button" data-dgrid="square" aria-label="Square grid" aria-pressed="'+(g==='square')+'">'+I.gridsq+'</button><button type="button" data-dgrid="justified" aria-label="Justified rows" aria-pressed="'+(g==='justified')+'">'+I.rows+'</button></div>'+
   '<label class="d-density">'+I.gridsq+'<span class="sr">Thumbnail size</span><input id="d-dens" type="range" min="100" max="260" step="10" value="'+state.dens+'"></label>'+
   '<button type="button" class="d-btn" data-nav="Import">'+I.upload+'Import</button><button type="button" class="d-btn primary" data-nav="Cull">'+I.cull+'Cull</button></div>'+
  '<div class="d-filters" role="group" aria-label="Filters"><button type="button" class="chip" aria-pressed="false">'+I.star+'3 stars or more</button><button type="button" class="chip" aria-pressed="false">'+I.flag+'Picks</button><button type="button" class="chip" aria-pressed="false">Photos and videos</button><button type="button" class="chip" aria-pressed="false">Any camera</button><button type="button" class="chip on" aria-pressed="true">Hide screenshots</button><button type="button" class="chip" aria-pressed="false">'+I.spark+'Has prompt</button><button type="button" class="chip add">'+I.plus+'Filter</button></div>'+
  '<div class="scroller" data-scroller><section class="d-hl" data-hl'+hidden()+'><div class="d-hl-row">'+
   HL.map((h,i)=>'<button type="button" class="d-hlc" data-hlp="'+i+'"><span class="d-hlc-img"><span class="ph-box" data-box="'+i+'"></span></span><span>'+h.t+'</span></button>').join('')+
  '</div></section><div class="tl" data-tl></div></div>'+
  '<footer class="d-status"><span class="live"><i></i>AI worker · Legion · RTX 5090</span><span>6.2 GB VRAM reserved via Mission Control</span><span>Faces: 1,284 queued</span><span>Captions: 9,410 queued</span><span>Integrity check passed 03:12</span></footer>'+
 '</div></div>';}
const BUILD={a:appA,b:appB,c:appC,d:appD};
function selbarHTML(){return '<div class="selbar" data-selbar hidden><button type="button" data-clear aria-label="Clear selection">'+I.x+'</button><span class="sb-n" data-seln>0 selected</span>'+
 '<button type="button" data-act="Favorite">'+I.heart+'<span>Favorite</span></button><button type="button" data-act="Add to album">'+I.album+'<span>Add to album</span></button><button type="button" data-act="Share">'+I.share+'<span>Share</span></button><button type="button" data-act="More actions" aria-label="More actions">'+I.more+'</button></div>';}

/* ---------------- rendering ---------------- */
const win=document.getElementById('window');
const note=document.getElementById('rv-note');
const hlToggle=document.getElementById('rv-hl');
let app=null,host=null,scroller=null,tl=null,scrub=null,ro=null,lastW=0,scrubBand=0,curMonth=null;
let PQ=[],raf=0,lt=0,ltForce=false,ticking=false,actT=0;

function queue(el,w,h,item){PQ.push({el:el,w:w,h:h,item:item});if(!raf)raf=requestAnimationFrame(flush);}
function flush(){
  raf=0;const t0=performance.now();
  while(PQ.length&&performance.now()-t0<14){
    const j=PQ.shift();if(!j.el.isConnected)continue;
    const c=photoCanvas(j.item,j.w,j.h);
    j.el.querySelectorAll('canvas.ph').forEach(x=>{if(x!==c)x.remove();});
    if(c.parentNode!==j.el)j.el.appendChild(c);
    if(!c.classList.contains('on'))requestAnimationFrame(()=>requestAnimationFrame(()=>c.classList.add('on')));
  }
  if(PQ.length)raf=requestAnimationFrame(flush);
}
function contentWidth(){const cs=getComputedStyle(tl);return Math.floor(tl.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight));}
function layout(force){
  if(!tl)return;
  const W=contentWidth();if(W<=40)return;
  if(!force&&Math.abs(W-lastW)<1)return;
  lastW=W;
  const st=scroller.scrollTop;
  tl.innerHTML=LIB.map(m=>'<section class="month" data-mkey="'+m.key+'">'+monthHead(m)+m.days.map(d=>'<div class="day">'+dayHead(d)+rowsHTML(d.items,W)+'</div>').join('')+'</section>').join('');
  scroller.scrollTop=st;
  PQ=PQ.filter(j=>j.el.isConnected);
  tl.querySelectorAll('.tile').forEach(t=>queue(t.querySelector('.tile-open'),parseFloat(t.style.width),parseFloat(t.style.height),ITEMS[t.dataset.id]));
  app.classList.toggle('selecting',state.sel.size>0);
}
function paintBoxes(){if(!app)return;app.querySelectorAll('[data-box]').forEach(b=>{const r=b.getBoundingClientRect();if(r.width<2||r.height<2)return;queue(b,r.width,r.height,HL[+b.dataset.box].item);});}
function scheduleLayout(force){if(force)ltForce=true;if(lt)return;lt=requestAnimationFrame(()=>{lt=0;const f=ltForce;ltForce=false;layout(f);positionScrub();paintBoxes();});}

function positionScrub(){
  if(!scrub||!host||!scroller)return;
  const hr=host.getBoundingClientRect(),sr=scroller.getBoundingClientRect();
  const pad=SCRUB_PAD[state.dir];
  const top=sr.top-hr.top+pad[0],bottom=hr.bottom-sr.bottom+pad[1];
  scrub.style.top=top+'px';scrub.style.bottom=bottom+'px';
  const sb=host.querySelector('[data-selbar]');
  if(sb&&state.dir!=='c')sb.style.top=(sr.top-hr.top+SEL_TOP[state.dir])+'px';
  const H=hr.height-top-bottom;
  if(H<80){scrub.innerHTML='';return;}
  const total=YEARS.reduce((a,y)=>a+y[1],0);
  let acc=0,last=-99,html='';
  YEARS.forEach(y=>{const t=acc/total*H;acc+=y[1];if(t-last>=18&&t<H-10){html+='<button type="button" class="scrub-y" data-year="'+y[0]+'" style="top:'+t.toFixed(1)+'px">'+y[0]+'</button>';last=t;}else{html+='<span class="scrub-dot" style="top:'+(t+4).toFixed(1)+'px"></span>';}});
  html+='<div class="scrub-handle" data-handle><span class="scrub-label" data-slabel></span></div>';
  scrub.innerHTML=html;scrubBand=YEARS[0][1]/total*H;
  updateScroll();
}
function rgb2hsl(r,g,b){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b);let h=0,s=0;const l=(mx+mn)/2;if(mx!==mn){const d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);h=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;h*=60;}return [h,s,l];}
function setAmbient(m){
  const items=[];m.days.forEach(d=>d.items.forEach(i=>items.push(i)));
  const it=items.find(i=>i.fav)||items[0];
  const c=photoCanvas(it,48,32);c.classList.add('on');
  const bd=app.querySelector('[data-backdrop]');if(bd&&c.parentNode!==bd)bd.replaceChildren(c);
  try{const d=c.getContext('2d').getImageData(0,0,c.width,c.height).data;let r=0,g=0,b=0,n=0;for(let i=0;i<d.length;i+=16){r+=d[i];g+=d[i+1];b+=d[i+2];n++;}
    const hsl=rgb2hsl(r/n,g/n,b/n);const hue=Math.round(hsl[0]);const s=Math.round(Math.min(.72,Math.max(.38,hsl[1]*1.8))*100);
    root.style.setProperty('--c-acc-l','hsl('+hue+' '+s+'% 38%)');root.style.setProperty('--c-acc-d','hsl('+hue+' '+s+'% 72%)');}catch(e){}
}
function updateScroll(){
  if(!scroller||!tl)return;
  const max=Math.max(1,scroller.scrollHeight-scroller.clientHeight),frac=Math.min(1,scroller.scrollTop/max);
  const hd=scrub&&scrub.querySelector('[data-handle]');if(hd)hd.style.top=(frac*scrubBand*.3).toFixed(1)+'px';
  const sr=scroller.getBoundingClientRect();let cur=null;
  tl.querySelectorAll('section.month').forEach(s=>{if(s.getBoundingClientRect().top-sr.top<=180)cur=s;});
  const key=cur?cur.dataset.mkey:LIB[0].key;const m=LIB.find(x=>x.key===key)||LIB[0];
  const label=m.month+' '+m.year;
  const sl=scrub&&scrub.querySelector('[data-slabel]');if(sl)sl.textContent=label;
  const pill=app.querySelector('[data-pill]');if(pill)pill.textContent=label;
  if(state.dir==='c'&&curMonth!==m.key){curMonth=m.key;setAmbient(m);}
}
function onScroll(){
  if(ticking)return;ticking=true;
  requestAnimationFrame(()=>{ticking=false;updateScroll();
    const pill=app&&app.querySelector('[data-pill]');
    if(scrub)scrub.classList.add('active');if(pill)pill.classList.add('show');
    clearTimeout(actT);actT=setTimeout(()=>{if(scrub)scrub.classList.remove('active');if(pill)pill.classList.remove('show');},1100);});
}
function renderApp(){
  if(ro)ro.disconnect();
  PQ=[];curMonth=null;lastW=0;
  win.innerHTML=BUILD[state.dir]();
  app=win.firstElementChild;
  host=app.hasAttribute('data-scrub-host')?app:app.querySelector('[data-scrub-host]');
  scroller=app.querySelector('[data-scroller]');
  tl=app.querySelector('[data-tl]');
  host.insertAdjacentHTML('beforeend',selbarHTML());
  scrub=document.createElement('div');scrub.className='scrub';scrub.setAttribute('role','navigation');scrub.setAttribute('aria-label','Jump to a year');host.appendChild(scrub);
  layout(true);paintBoxes();positionScrub();
  scroller.addEventListener('scroll',onScroll,{passive:true});
  const dens=app.querySelector('#d-dens');
  if(dens){dens.addEventListener('input',()=>{state.dens=+dens.value;scheduleLayout(true);});dens.addEventListener('change',save);}
  syncSel();
  if(typeof ResizeObserver!=='undefined'){ro=new ResizeObserver(()=>scheduleLayout(false));ro.observe(tl);ro.observe(host);}
}

/* ---------------- selection ---------------- */
function syncSel(){
  if(!app)return;
  const n=state.sel.size;
  app.classList.toggle('selecting',n>0);
  app.querySelectorAll('.tile').forEach(t=>{const on=state.sel.has(t.dataset.id);t.classList.toggle('sel',on);const c=t.querySelector('.tile-check');if(c)c.setAttribute('aria-pressed',on);});
  const sb=app.querySelector('[data-selbar]');
  if(sb){sb.hidden=n===0;const el=sb.querySelector('[data-seln]');if(el)el.textContent=n+' selected';}
}
function toggleSel(id){if(state.sel.has(id))state.sel.delete(id);else state.sel.add(id);syncSel();}
function selectDay(id){const d=DAYS[id];if(!d)return;const all=d.items.every(i=>state.sel.has(i.id));d.items.forEach(i=>{if(all)state.sel.delete(i.id);else state.sel.add(i.id);});syncSel();}

/* ---------------- toast ---------------- */
const toastEl=document.getElementById('toast');let toastT=0;
function toast(msg){toastEl.textContent=msg;toastEl.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>toastEl.classList.remove('show'),2600);}

/* ---------------- review controls ---------------- */
function applyTheme(){if(state.theme==='system')root.removeAttribute('data-theme');else root.setAttribute('data-theme',state.theme);}
function syncReview(){
  document.querySelectorAll('[data-dir]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.dir===state.dir));
  document.querySelectorAll('[data-theme-set]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.themeSet===state.theme));
  const g=state.grid[state.dir];
  document.querySelectorAll('[data-grid-set]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.gridSet===g));
  if(app)app.querySelectorAll('[data-dgrid]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.dgrid===g));
  hlToggle.checked=state.hl;
  note.innerHTML=NOTES[state.dir]+NOTE_TAIL;
}
function setGrid(g){if(state.grid[state.dir]===g)return;state.grid[state.dir]=g;save();syncReview();layout(true);}
document.querySelectorAll('[data-dir]').forEach(b=>b.addEventListener('click',()=>{
  if(state.dir===b.dataset.dir)return;state.dir=b.dataset.dir;state.sel.clear();save();
  try{history.replaceState(null,'','#'+state.dir);}catch(e){}
  renderApp();syncReview();
}));
document.querySelectorAll('[data-theme-set]').forEach(b=>b.addEventListener('click',()=>{state.theme=b.dataset.themeSet;applyTheme();save();syncReview();}));
document.querySelectorAll('[data-grid-set]').forEach(b=>b.addEventListener('click',()=>setGrid(b.dataset.gridSet)));
hlToggle.addEventListener('change',()=>{state.hl=hlToggle.checked;save();
  const s=app&&app.querySelector('[data-hl]');if(s){s.hidden=!state.hl;}
  scheduleLayout(true);});

win.addEventListener('click',e=>{
  const t=e.target;
  const chk=t.closest('[data-check]');if(chk){toggleSel(chk.dataset.check);return;}
  const op=t.closest('[data-open]');if(op){if(state.sel.size)toggleSel(op.dataset.open);else toast('Opening a photo shows the viewer. That screen is the next mockup.');return;}
  const sd=t.closest('[data-selday]');if(sd){selectDay(sd.dataset.selday);return;}
  const yr=t.closest('[data-year]');if(yr){toast('Jumps to '+yr.dataset.year+'. This sample library covers August to October 2026.');return;}
  if(t.closest('[data-clear]')){state.sel.clear();syncSel();return;}
  const act=t.closest('[data-act]');if(act){toast(act.dataset.act+': '+state.sel.size+' selected');return;}
  const hl=t.closest('[data-hlp]');if(hl){toast(HL[+hl.dataset.hlp].t+' opens as a full-screen story.');return;}
  const dg=t.closest('[data-dgrid]');if(dg){setGrid(dg.dataset.dgrid);return;}
  const chip=t.closest('.chip');if(chip){if(chip.classList.contains('add')){toast('Add a filter by rating, flag, label, camera, lens, place, person or prompt.');return;}const on=!chip.classList.contains('on');chip.classList.toggle('on',on);chip.setAttribute('aria-pressed',on);return;}
  const nv=t.closest('[data-nav]');if(nv){toast(nv.dataset.nav+' is its own screen. This mockup shows the Library.');return;}
  const a=t.closest('a[href="#"]');if(a){e.preventDefault();if(!a.hasAttribute('aria-current')){const s=a.querySelector('span');toast((s?s.textContent:a.textContent).trim()+' is its own screen. This mockup shows the Library.');}return;}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.sel.size){state.sel.clear();syncSel();}});

/* ---------------- start ---------------- */
applyTheme();
renderApp();
syncReview();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{positionScrub();paintBoxes();});
})();
</script>
